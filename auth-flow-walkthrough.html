<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Horizon Remote Auth — Step-by-Step Walkthrough</title>
<style>
  :root{
    --browser:#4285f4; --browser-bg:#e8f0fe;
    --ns:#34a853; --ns-bg:#e6f4ea;
    --vendor:#f9ab00; --vendor-bg:#fef7e0;
    --ink:#1a1a1a; --muted:#5f6368; --line:#dadce0; --code-bg:#0f1729; --code-ink:#e6edf3;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); background:#f4f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
  }
  .app{max-width:1080px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:#fff;
       box-shadow:0 0 0 1px var(--line);}
  /* Header */
  header{padding:18px 28px 12px; border-bottom:1px solid var(--line);}
  .crumbs{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
         padding:3px 9px; border-radius:999px; color:#fff; background:var(--muted);}
  .badge.browser{background:var(--browser);} .badge.ns{background:var(--ns);} .badge.vendor{background:var(--vendor);}
  .counter{font-size:12.5px; color:var(--muted); margin-left:auto;}
  h1{font-size:21px; margin:8px 0 0;}
  /* Actor strip */
  .strip-wrap{padding:18px 28px 4px;}
  .strip{display:flex; gap:10px; position:relative;}
  .actor{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:10px 8px; text-align:center;
         background:#fafbfc; transition:all .18s ease; opacity:.55;}
  .actor .nm{font-size:13.5px; font-weight:700;}
  .actor .sub{font-size:10.5px; color:var(--muted); margin-top:2px; font-family:ui-monospace,Menlo,monospace;}
  .actor.dim{opacity:.45;}
  .actor.from{opacity:1; border-color:#888; box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .actor.to{opacity:1; box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .actor.to.zbrowser{border-color:var(--browser); background:var(--browser-bg);}
  .actor.to.zns{border-color:var(--ns); background:var(--ns-bg);}
  .actor.to.zvendor{border-color:var(--vendor); background:var(--vendor-bg);}
  .actor.proc{opacity:1; box-shadow:0 0 0 3px rgba(0,0,0,.05);}
  .actor.proc.zbrowser{border-color:var(--browser); background:var(--browser-bg); animation:pulse 1.4s ease-in-out infinite;}
  .actor.proc.zns{border-color:var(--ns); background:var(--ns-bg); animation:pulse 1.4s ease-in-out infinite;}
  .actor.proc.zvendor{border-color:var(--vendor); background:var(--vendor-bg); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,168,83,.0);}50%{box-shadow:0 0 0 6px rgba(0,0,0,.06);}}
  /* Arrow track */
  .track{height:76px; position:relative; margin-top:2px;}
  #arrowSvg{position:absolute; left:0; top:0; overflow:visible;}
  .arrow-line{stroke:#374151; stroke-width:2.5; fill:none;}
  .arrow-line.dashed{stroke-dasharray:7 5;}
  .arrow-label{font:600 12.5px -apple-system,Segoe UI,Roboto,sans-serif; fill:#111;}
  .arrow-dot{fill:#374151;}
  .proc-note{position:absolute; left:50%; top:26px; transform:translateX(-50%);
             font-size:12.5px; color:var(--muted); background:#f1f3f4; border:1px solid var(--line);
             padding:5px 12px; border-radius:999px;}
  /* Content */
  .content{flex:1; padding:6px 28px 20px; display:grid; grid-template-columns:1fr 360px; gap:22px;}
  .content.single{grid-template-columns:1fr;}
  .what h2{font-size:16px; margin:14px 0 6px;}
  .what p{font-size:14.5px; margin:8px 0;}
  .what ul{font-size:14px; margin:8px 0; padding-left:20px;} .what li{margin:4px 0;}
  code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; background:#eef0f2; padding:1px 5px; border-radius:4px;}
  .side{display:flex; flex-direction:column; gap:14px;}
  .sec{border:1px solid #f0e0a0; background:#fffbe6; border-radius:10px; padding:12px 14px;}
  .sec h3{margin:0 0 6px; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:#8a6d00;}
  .sec p{margin:5px 0; font-size:13px;}
  pre{background:var(--code-bg); color:var(--code-ink); border-radius:10px; padding:12px 14px; margin:0;
      overflow:auto; font-size:12px; line-height:1.5; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .data-cap{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:0 0 5px;}
  .intro-card{border:1px solid var(--line); border-radius:12px; padding:20px 24px; background:linear-gradient(180deg,#fafbff,#fff);}
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px;}
  .legend span{display:inline-flex; align-items:center; gap:7px; font-size:13px;}
  .sw{width:13px; height:13px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.2);}
  .sw.b{background:var(--browser-bg); border-color:var(--browser);}
  .sw.n{background:var(--ns-bg); border-color:var(--ns);}
  .sw.v{background:var(--vendor-bg); border-color:var(--vendor);}
  /* Footer nav */
  footer{border-top:1px solid var(--line); padding:12px 28px; display:flex; align-items:center; gap:14px;}
  button{font:inherit; font-size:14px; font-weight:600; padding:9px 18px; border-radius:8px; cursor:pointer;
         border:1px solid var(--line); background:#fff;}
  button.primary{background:#1a73e8; color:#fff; border-color:#1a73e8;}
  button:disabled{opacity:.4; cursor:default;}
  .dots{display:flex; gap:6px; margin:0 auto; flex-wrap:wrap; max-width:520px;}
  .dot{width:11px; height:11px; border-radius:50%; background:#cdd2d8; border:none; padding:0; cursor:pointer;}
  .dot.active{background:#1a73e8; transform:scale(1.18);}
  .dot.done{background:#9aa0a6;}
  .hint{font-size:11.5px; color:var(--muted); text-align:center; padding:0 0 14px;}
  @media (max-width:820px){ .content{grid-template-columns:1fr;} .actor .sub{display:none;} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="crumbs">
      <span class="badge" id="phaseBadge">Intro</span>
      <span class="counter" id="counter"></span>
    </div>
    <h1 id="title"></h1>
  </header>

  <div class="strip-wrap">
    <div class="strip" id="strip">
      <div class="actor" data-key="app"><div class="nm">SDK App</div><div class="sub">app-horizon-debug</div></div>
      <div class="actor" data-key="host"><div class="nm">Horizon Host</div><div class="sub">netsapiens-horizon</div></div>
      <div class="actor" data-key="api"><div class="nm">ns-api v2</div><div class="sub">Oauth2Controller</div></div>
      <div class="actor" data-key="db"><div class="nm">oauth_codes</div><div class="sub">DB</div></div>
      <div class="actor" data-key="insight"><div class="nm">NS Insight</div><div class="sub">attestation</div></div>
      <div class="actor" data-key="vendor"><div class="nm">Vendor Server</div><div class="sub">mock-vendor-server</div></div>
    </div>
    <div class="track" id="track">
      <svg id="arrowSvg" height="76">
        <defs>
          <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L8,3 L0,6 Z" fill="#374151"></path>
          </marker>
        </defs>
      </svg>
      <div class="proc-note" id="procNote" style="display:none;"></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="what" id="what"></div>
    <div class="side" id="side"></div>
  </div>

  <footer>
    <button id="prev">‹ Prev</button>
    <div class="dots" id="dots"></div>
    <button id="next" class="primary">Next ›</button>
  </footer>
  <div class="hint">Use the <strong>← →</strong> arrow keys or the buttons. Each dot jumps to a step.</div>
</div>

<script>
const STEPS = [
  {
    kind:'intro', zone:'', title:'Horizon Remote Authentication — Step by Step',
    what:`<div class="intro-card">
      <p>This walkthrough follows a <strong>remote-auth</strong> request end to end: a third-party SDK app asks the
      Horizon host to obtain an access token from an external vendor. Four actors are involved, across three trust zones.</p>
      <ul>
        <li><strong>SDK App</strong> — untrusted third-party code running inside the host (browser).</li>
        <li><strong>Horizon Host</strong> — the trusted shell that loads apps and brokers their requests (browser).</li>
        <li><strong>ns-api v2</strong> — the NetSapiens backend that owns identity, codes, and signing keys.</li>
        <li><strong>Vendor Server</strong> — the external third party, reachable only at an allow-listed callback URL.</li>
      </ul>
      <div class="legend">
        <span><i class="sw b"></i> Browser — untrusted app code</span>
        <span><i class="sw n"></i> NetSapiens — trusted backend</span>
        <span><i class="sw v"></i> Vendor — external third party</span>
      </div>
      <p style="margin-top:12px;color:var(--muted);font-size:13px;">Press <strong>Next ›</strong> to begin. 19 pages.</p>
    </div>`,
    sec:'', data:''
  },
  {
    kind:'msg', from:'app', to:'host', zone:'browser', title:'App requests remote auth',
    what:`<p>The app calls <code>horizonContext.auth.requestRemoteAuth(request, options)</code>. The SDK emits a
      <code>remote-auth:request</code> event carrying a unique <code>correlationId</code> (UUID) and then
      <em>awaits</em> a matching <code>remote-auth:response:{correlationId}</code> over the in-page EventBus —
      it is event-driven, not polling.</p>
      <p>The default timeout is 60s; the demo uses 90s.</p>`,
    sec:`<h3>Security · host ↔ app channel</h3>
      <p>The app is untrusted browser code. Host ↔ app messages can be wrapped as a <code>SignedMessage</code> —
      HMAC-SHA256 over <code>appId|type|payload|nonce|timestamp</code> with nonce-replay and timestamp-freshness checks
      (<code>MessageSigner.ts</code>).</p>`,
    data:`// request payload
{
  "vendorId": "demo-app-with-auth",
  "callbackUrl": "https://sdk.nseng.dev/mock-server/oauth/callback",
  "scopes": ["read","write"],
  "metadata": { "timestamp": "2026-06-14T12:00:00Z" }
}`
  },
  {
    kind:'proc', at:'host', zone:'browser', title:'Host validates the request',
    what:`<p>Before touching the backend, the host runs three local gates:</p>
      <ul>
        <li>the app must hold the <code>remote-auth:request</code> permission;</li>
        <li><code>remote_auth_enabled === 'yes'</code> for this extension;</li>
        <li>the <code>callbackUrl</code> origin must match the extension's <code>allowed_hostnames</code>
          (exact or <code>*.</code>wildcard, with a dot-boundary so <code>evil-example.com</code> is rejected).</li>
      </ul>`,
    sec:`<h3>Security · permission + allowlist</h3>
      <p>The <code>PermissionManager</code> enforces per-app capabilities, and the callback allowlist ensures the
      signed webhook (later) can only target pre-approved destinations. This is a first, client-side check —
      ns-api repeats it authoritatively.</p>`,
    data:''
  },
  {
    kind:'msg', from:'host', to:'api', zone:'ns', title:'Host calls ns-api: initiate',
    what:`<p>The host makes an authenticated server call to <code>POST /v2/oauth2/remote-auth/initiate</code>,
      carrying the signed-in user's <strong>session bearer token</strong>. The body identifies the app, the vendor,
      the callback, and the user.</p>`,
    sec:`<h3>Security · session JWT</h3>
      <p>The bearer token is a NetSapiens JWT, signed <strong>RS256</strong> (verified via JWKS) or
      <strong>HS256</strong> (per-user + cluster salt). Invalid/expired → <code>RA001</code>/<code>RA002</code>.
      The user's identity here — not the body — is what the code is bound to.</p>`,
    data:`POST /v2/oauth2/remote-auth/initiate
Authorization: Bearer <session JWT>

{
  "appId": "demo-app-with-auth",
  "vendorId": "demo-app-with-auth",
  "callbackUrl": "https://sdk.nseng.dev/mock-server/oauth/callback",
  "scopes": ["read","write"],
  "user": { "uid":"1000", "domain":"example.com", "login":"1000@example.com" }
}`
  },
  {
    kind:'proc', at:'api', zone:'ns', title:'ns-api authenticates & loads config',
    what:`<p>The controller (<code>Oauth2Controller::remoteAuth()</code>) validates the bearer token, loads the
      <code>horizon_extensions</code> row by <code>appId</code>, confirms <code>remote_auth_enabled</code>, and
      <strong>re-validates</strong> the callback URL against <code>allowed_hostnames</code>.</p>`,
    sec:`<h3>Security · server-side authority</h3>
      <p>ns-api never trusts the client's checks. Failures map to explicit codes: <code>RA006</code> (not enabled),
      <code>RA007</code>/<code>RA007B</code> (bad/blocked callback).</p>`,
    data:''
  },
  {
    kind:'msg', from:'api', to:'db', zone:'ns', title:'ns-api mints the code + PKCE pair',
    what:`<p>ns-api generates a PKCE pair and stores an authorization code:</p>
      <ul>
        <li><code>code_verifier = base64url(random_bytes(32))</code> — 256-bit;</li>
        <li><code>code_challenge = base64url(SHA256(verifier))</code>;</li>
        <li>an auth code in <code>oauth_codes</code> bound to the <strong>session</strong> uid (not the request body),
          TTL <strong>600s</strong>, single-use, storing only the <em>challenge</em> + method <code>S256</code>.</li>
      </ul>`,
    sec:`<h3>Security · server-side PKCE + code binding</h3>
      <p>This is a server-side PKCE variant: ns-api mints the verifier and will hand it to the vendor over the signed
      webhook. Only the challenge is stored. The code is pinned to the authenticated user and is single-use.</p>`,
    data:`// oauth_codes row
{
  code:            "<random>",
  client_id:       "demo-app-with-auth",   // vendorId
  redirect_uri:    "<callbackUrl>",
  username:        "1000@example.com",      // SESSION identity
  code_challenge:  "base64url(SHA256(verifier))",
  code_challenge_method: "S256",
  expires:         now + 600                // 10 min, single-use
}`
  },
  {
    kind:'msg', from:'api', to:'insight', zone:'ns', title:'ns-api fetches a cluster-verification token',
    what:`<p>Before sending the webhook, ns-api asks <strong>NetSapiens Insight</strong> to vouch for it. It calls
      <code>POST /getClusterVerificationToken?appId=…</code>, authenticating with a short-lived
      <strong>service token it holds on disk</strong> at <code>/etc/netsapiens/insight.d/token.jwt</code> — the
      cluster's own machine identity, rotated out of band (not the user's session token).</p>
      <p>The result is cached for 10 minutes per <code>appId</code>, so this call is skipped on repeat requests.</p>`,
    sec:`<h3>Security · server-side machine identity</h3>
      <p>The on-disk token never leaves the server and is presented only to Insight over TLS. It lets ns-api prove
      <em>which cluster</em> it is, so Insight can issue a signed attestation about it.</p>`,
    data:`POST https://insight.netsapiens.com/getClusterVerificationToken?appId=demo-app-with-auth
Authorization: Bearer <on-disk Insight service token>
(TLS verified, 10s timeout, result cached 10 min)`
  },
  {
    kind:'msg', from:'insight', to:'api', dashed:true, zone:'ns', title:'Insight returns a signed attestation',
    what:`<p>Insight authenticates the service token and returns an <strong>RS256-signed JWT</strong> attesting to
      the calling cluster. ns-api will attach this JWT to the webhook as the
      <code>X-NS-Cluster-Verification</code> header.</p>`,
    sec:`<h3>Security · asymmetric attestation</h3>
      <p>The JWT is signed with Insight's private key; anyone can verify it with Insight's public JWKS — no shared
      secret needed. Its claims name the cluster and client.</p>`,
    data:`// Insight → ns-api
{ "token": "<RS256 JWT>" }

// decoded JWT claims
{
  "cluster_id": 23573,
  "cluster_name": "Dev Lab (Chris)",
  "client": "netsapiens",
  "client_id": 1,
  "scope": "verification",
  "iss": "https://insight.netsapiens.com",
  "iat": 1770999000, "exp": 1770999600
}`
  },
  {
    kind:'msg', from:'api', to:'vendor', zone:'vendor', title:'Signed webhook to the vendor',
    what:`<p>ns-api makes a <strong>blocking</strong> POST to the vendor's <code>callbackUrl</code>
      (timeout = <code>remote_timeout_seconds</code>, default 30s, TLS verified). The body carries the
      <code>code</code>, the <code>code_verifier</code>, the user, the <code>validation_endpoint</code>, and
      <code>pkce_enabled</code>.</p>`,
    sec:`<h3>Security · HMAC + cluster JWT</h3>
      <p><strong>X-NS-Signature</strong> = <code>HMAC-SHA256(request_id + code + timestamp, remote_callback_secret)</code>.
      <strong>X-NS-Cluster-Verification</strong> carries the RS256 attestation JWT fetched from Insight in the
      previous two steps — a second, asymmetric proof of who is calling.</p>`,
    data:`POST <callbackUrl>
X-NS-Request-ID: remauth_xxx
X-NS-Signature: sha256=<hmac>
X-NS-Cluster-Verification: <RS256 JWT>   (optional)

{
  "request_id":"remauth_xxx", "code":"<code>",
  "code_verifier":"<base64url>",
  "user":{ "uid":"1000@example.com" },
  "validation_endpoint":".../oauth2/token",
  "timestamp":1770999400, "pkce_enabled":true,
  "signature":"<hmac>"
}`
  },
  {
    kind:'proc', at:'vendor', zone:'vendor', title:'Vendor verifies the webhook',
    what:`<p>The vendor authenticates the incoming webhook before acting on it:</p>
      <ul>
        <li>recompute <code>HMAC-SHA256(request_id + code + timestamp, secret)</code> and constant-time compare
          (401 on mismatch);</li>
        <li>optionally verify the <code>X-NS-Cluster-Verification</code> JWT against Insight's public JWKS
          (RS256, <code>scope='verification'</code>, matching <code>appId</code>) — this confirms the caller is a
          <strong>trusted NetSapiens server</strong> and surfaces the <code>client</code> and
          <code>cluster_name</code>;</li>
        <li>require <code>pkce_enabled && code_verifier</code>.</li>
      </ul>`,
    sec:`<h3>Security · webhook authenticity</h3>
      <p>The HMAC proves the webhook came from a holder of the shared secret. The cluster JWT independently proves it
      came from a genuine NetSapiens cluster (verified with Insight's public keys, no shared secret) and tells the
      vendor <em>which client and cluster</em>. Only then does the vendor redeem the code.</p>`,
    data:''
  },
  {
    kind:'msg', from:'vendor', to:'api', zone:'ns', title:'Vendor redeems the code',
    what:`<p>The vendor calls <code>POST /v2/oauth2/token</code> (form-encoded) to exchange the code. It echoes back
      the <code>code_verifier</code> it received and includes <strong>no client secret</strong>.</p>`,
    sec:`<h3>Security · PKCE replaces the secret</h3>
      <p>Possession of the exact <code>code_verifier</code> from the webhook is the proof of legitimacy — there is no
      client_id/client_secret in this exchange.</p>`,
    data:`POST /v2/oauth2/token
Content-Type: application/x-www-form-urlencoded

grant_type=authorization_code
code=<code>
code_verifier=<same verifier from webhook>
username=1000@example.com
redirect_uri=<callbackUrl>`
  },
  {
    kind:'proc', at:'api', zone:'ns', title:'ns-api validates PKCE & consumes the code',
    what:`<p>ns-api loads the code, requires a <code>code_verifier</code>, and validates S256:
      <code>hash_equals(challenge, base64url(SHA256(verifier)))</code>. It checks the username, then
      <strong>deletes the code</strong> (single-use), and issues an NS access token (JWT).</p>`,
    sec:`<h3>Security · single-use + PKCE proof</h3>
      <p>The code cannot be replayed — it is consumed atomically on success. A stolen code without the matching
      verifier fails the S256 check.</p>`,
    data:''
  },
  {
    kind:'msg', from:'api', to:'vendor', dashed:true, zone:'vendor', title:'ns-api returns the NS token',
    what:`<p>The backend returns its own access token (an NS JWT) to the vendor as the response to the
      token-exchange call.</p>`,
    sec:`<h3>Security · scoped NS token</h3>
      <p>This NS JWT represents the user context the vendor is now authorized to act with, should it call back into
      NetSapiens APIs.</p>`,
    data:''
  },
  {
    kind:'proc', at:'vendor', zone:'vendor', title:'Vendor issues its own token',
    what:`<p>Having validated everything, the vendor mints <strong>its own</strong> access token
      (<code>mock_vendor_token_…</code>) and returns it as the HTTP response to the original webhook (step 7),
      which ns-api is still blocking on.</p>`,
    sec:`<h3>Security · vendor owns its tokens</h3>
      <p>The token the app ultimately receives is the vendor's, not NetSapiens'. Its format and lifetime are the
      vendor's choice (<code>expires_in</code>, optional <code>refresh_token</code>).</p>`,
    data:`// vendor → ns-api (webhook response)
{
  "access_token":"mock_vendor_token_ab12…",
  "token_type":"Bearer", "expires_in":7200,
  "refresh_token":"mock_refresh_…",
  "scope":"read write",
  "cluster_verification":{ "verified":true }
}`
  },
  {
    kind:'msg', from:'vendor', to:'api', dashed:true, zone:'ns', title:'Vendor returns token to ns-api',
    what:`<p>The vendor's response completes the blocking webhook call from step 7. ns-api now holds the vendor's
      access token.</p>`,
    sec:`<h3>Security · synchronous relay</h3>
      <p>Because the whole exchange happens inside one blocking webhook, no token is ever persisted on the vendor's
      side mid-flight or exposed to the browser prematurely.</p>`,
    data:''
  },
  {
    kind:'msg', from:'api', to:'host', dashed:true, zone:'browser', title:'ns-api relays the token to the host',
    what:`<p>ns-api transforms the vendor response and returns it as the <code>initiate</code> response. A vendor
      failure instead yields <code>502 RA009</code>.</p>`,
    sec:`<h3>Security · single authenticated channel</h3>
      <p>The browser only ever talks to ns-api over the authenticated session; it never speaks to the vendor's token
      endpoint directly.</p>`,
    data:`// initiate response (200)
{
  "vendorId":"demo-app-with-auth",
  "accessToken":"mock_vendor_token_ab12…",
  "tokenType":"Bearer",
  "expiresAt":1771000000,
  "refreshToken":"mock_refresh_…",
  "user":{ "uid":"1000", "login":"1000@example.com" },
  "clusterVerification":{ "verified":true }
}`
  },
  {
    kind:'proc', at:'host', zone:'browser', title:'Host stores the token & resolves',
    what:`<p>The host calls <code>remoteAuthStore.setToken(appId, vendorId, …)</code> — persisted via Zustand to
      <code>localStorage</code> (store <code>horizon-remote-auth-storage</code>, key <code>appId:vendorId</code>,
      with a 5-minute expiry buffer). It then emits <code>remote-auth:response:{correlationId}</code>, which
      resolves the app's awaiting promise.</p>`,
    sec:`<h3>Security · scoped storage</h3>
      <p>Tokens are keyed per <code>appId:vendorId</code>, so one app cannot read another's token, and validity is
      checked against <code>expiresAt</code> on retrieval.</p>`,
    data:''
  },
  {
    kind:'msg', from:'app', to:'vendor', zone:'vendor', title:'App uses the token',
    what:`<p>The app now calls the vendor's API with the bearer token, e.g.
      <code>GET /api/user-data</code> with <code>Authorization: Bearer &lt;accessToken&gt;</code>. Later it can call
      <code>getRemoteAuthToken(vendorId)</code> or <code>clearRemoteAuthToken(vendorId)</code>.</p>`,
    sec:`<h3>Security · vendor bearer token</h3>
      <p>The vendor validates its own token (prefix/shape/expiry) and returns 401 otherwise. The credential never
      passed through the vendor's browser-facing surface unsigned.</p>`,
    data:`GET /api/user-data
Authorization: Bearer mock_vendor_token_ab12…

200 OK → { user, account, permissions, … }`
  },
  {
    kind:'recap', zone:'', title:'Recap & always-on controls',
    what:`<p>The linear flow you just walked: <strong>request → validate → mint code+PKCE → attest via Insight →
      signed webhook → verify → redeem (PKCE) → relay token → store → use</strong>.</p>
      <p>Two security layers run <em>around</em> this flow, not inside the line:</p>
      <ul>
        <li><strong>Host ↔ app message signing</strong> — HMAC-SHA256 over <code>appId|type|payload|nonce|timestamp</code>,
          with nonce-replay + timestamp freshness (<code>MessageSigner.ts</code>).</li>
        <li><strong>Module-load controls</strong> — approved domains, optional SRI hash, CSP nonce, and a 10-loads/min
          rate limit (<code>ModuleLoader.ts</code>, <code>IntegrityValidator.ts</code>).</li>
        <li><strong>Per-app API proxy</strong> — 100 req/min per app plus an audit-log entry per call
          (<code>HorizonApiProxy.ts</code>).</li>
      </ul>
      <p style="color:var(--muted);font-size:13px;">For the full reference (data shapes, error codes, file paths) see
      <code>AUTH_FLOW.md</code> / <code>auth-flow.html</code>.</p>`,
    sec:'', data:''
  }
];

const idx = { app:0, host:1, api:2, db:3, vendor:4 };
const zoneClass = z => z==='browser'?'zbrowser':z==='ns'?'zns':z==='vendor'?'zvendor':'';
let cur = 0;

const $ = id => document.getElementById(id);

function buildDots(){
  const dots = $('dots'); dots.innerHTML='';
  STEPS.forEach((_,i)=>{
    const b=document.createElement('button'); b.className='dot'; b.title='Step '+i;
    b.addEventListener('click',()=>go(i));
    dots.appendChild(b);
  });
}

function actorEl(key){ return document.querySelector('.actor[data-key="'+key+'"]'); }

function positionArrow(s){
  const svg=$('arrowSvg'); const proc=$('procNote');
  // reset markers/lines but keep defs
  svg.querySelectorAll('.arrow-line,.arrow-label,.arrow-dot').forEach(n=>n.remove());
  proc.style.display='none';
  const strip=$('strip').getBoundingClientRect();
  svg.setAttribute('width', strip.width);
  if(s.kind==='proc'){
    proc.textContent='⚙  '+actorEl(s.at).querySelector('.nm').textContent+' is working…';
    proc.style.display='block';
    return;
  }
  if(s.kind!=='msg') return;
  const fr=actorEl(s.from).getBoundingClientRect(), tr=actorEl(s.to).getBoundingClientRect();
  const x1=fr.left+fr.width/2-strip.left, x2=tr.left+tr.width/2-strip.left;
  const y=30;
  const dir = x2>x1?1:-1;
  const sx=x1+dir*6, ex=x2-dir*10;
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('cx',sx); dot.setAttribute('cy',y); dot.setAttribute('r',4); dot.setAttribute('class','arrow-dot');
  svg.appendChild(dot);
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',sx); line.setAttribute('y1',y); line.setAttribute('x2',ex); line.setAttribute('y2',y);
  line.setAttribute('class','arrow-line'+(s.dashed?' dashed':'')); line.setAttribute('marker-end','url(#ah)');
  svg.appendChild(line);
  const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
  lbl.setAttribute('x',(sx+ex)/2); lbl.setAttribute('y',y-12); lbl.setAttribute('text-anchor','middle');
  lbl.setAttribute('class','arrow-label');
  lbl.textContent=(s.dashed?'↩ ':'')+(s.label||'');
  svg.appendChild(lbl);
}

function render(){
  const s=STEPS[cur];
  // header
  const z=s.zone;
  $('phaseBadge').className='badge '+zoneClass(z).replace('z','');
  $('phaseBadge').textContent = s.kind==='intro'?'Intro': s.kind==='recap'?'Recap'
      : z==='browser'?'Browser': z==='ns'?'NetSapiens': z==='vendor'?'Vendor':'Step';
  $('counter').textContent = cur===0?'':'Step '+cur+' of '+(STEPS.length-2);
  $('title').textContent=s.title;
  // actors
  document.querySelectorAll('.actor').forEach(a=>{a.className='actor dim';});
  if(s.kind==='msg'){
    const f=actorEl(s.from), t=actorEl(s.to);
    f.className='actor from'; t.className='actor to '+zoneClass(s.zone);
  } else if(s.kind==='proc'){
    actorEl(s.at).className='actor proc '+zoneClass(s.zone);
  } else {
    document.querySelectorAll('.actor').forEach(a=>a.className='actor');
  }
  positionArrow(s);
  // content
  $('what').innerHTML=s.what||'';
  const side=$('side'); side.innerHTML='';
  const content=$('content');
  if(s.sec||s.data){
    content.classList.remove('single');
    if(s.sec){ const d=document.createElement('div'); d.className='sec'; d.innerHTML=s.sec; side.appendChild(d); }
    if(s.data){
      const cap=document.createElement('div'); cap.className='data-cap'; cap.textContent='Data';
      const pre=document.createElement('pre'); pre.textContent=s.data;
      side.appendChild(cap); side.appendChild(pre);
    }
  } else {
    content.classList.add('single');
  }
  // nav
  $('prev').disabled = cur===0;
  $('next').disabled = cur===STEPS.length-1;
  $('next').textContent = cur===STEPS.length-1?'Done':'Next ›';
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i===cur?' active':(i<cur?' done':''));
  });
}

function go(i){ cur=Math.max(0,Math.min(STEPS.length-1,i)); render(); }
$('prev').addEventListener('click',()=>go(cur-1));
$('next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(cur+1);}
  else if(e.key==='ArrowLeft'){ e.preventDefault(); go(cur-1);}
});
window.addEventListener('resize',()=>positionArrow(STEPS[cur]));

buildDots();
render();
</script>
</body>
</html>
