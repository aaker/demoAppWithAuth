# Reverse-proxy snippet for mock-vendor-server: /mock-server -> 127.0.0.1:3001
#
# The /mock-server prefix is stripped before proxying, so
#   https://host/mock-server/oauth/callback  ->  http://127.0.0.1:3001/oauth/callback
#
# Drop-in for conf.d. TLS and logging are handled by the host's existing vhost;
# this file only wires up the proxy.
#
#   Debian/Ubuntu:  sudo cp mock-vendor-server-proxy.conf /etc/apache2/conf-available/
#                   sudo a2enmod proxy proxy_http headers
#                   sudo a2enconf mock-vendor-server-proxy
#                   sudo apache2ctl configtest && sudo systemctl reload apache2
#
#   RHEL/CentOS:    sudo cp mock-vendor-server-proxy.conf /etc/httpd/conf.d/
#                   sudo apachectl configtest && sudo systemctl reload httpd

ProxyPreserveHost On
ProxyRequests Off

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port  "443"

ProxyPass        /mock-server http://127.0.0.1:3001 retry=0
ProxyPassReverse /mock-server http://127.0.0.1:3001
